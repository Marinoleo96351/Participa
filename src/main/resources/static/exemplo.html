<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Participa — Exemplo visual</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="nav">
    <span class="nav-brand">Participa</span>
    <span class="tag tag-neutral">Turma de exemplo</span>
  </header>

  <main>
    <h6>Base visual</h6>
    <h2>Exemplo de componentes</h2>
    <p class="text-muted">Esta página demonstra a fonte local e os componentes do sistema visual.</p>

    <section class="card elev-sm">
      <span class="card-kicker">Dúvida de exemplo</span>
      <h3 class="card-title">Como funciona a participação na aula?</h3>
      <p class="card-body">Os estilos deste cartão vêm da folha de estilos do handoff.</p>
      <span class="tag tag-outline">Anônima</span>
      <div>
        <button class="btn btn-primary" type="button">Apoiar</button>
        <button class="btn btn-secondary" type="button">Ver detalhes</button>
      </div>
    </section>

    <div class="field">
      <label for="mensagem">Campo de exemplo</label>
      <input class="input" id="mensagem" type="text" placeholder="Digite um texto">
    </div>
  </main>
</body>
</html>
