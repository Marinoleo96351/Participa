spring.application.name=participa

app.nome=Participa
app.dominio-estudante=@alunos.utfpr.edu.br
app.dominio-professor=@utfpr.edu.br

spring.profiles.default=local

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# US16: compressão HTTP para reduzir o consumo de dados do estudante
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024
